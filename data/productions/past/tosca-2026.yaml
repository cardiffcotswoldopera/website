description: Raising funds for Diabetes UK, a cast and creative team of remarkable young artists come together FOR ONE NIGHT ONLY to present one of the most beloved cornerstones of the operatic repertoire.
description_long: |
  In just 48 hours of rehearsal time, our company will present a special performance of Puccini's Tosca—an extraordinary event that brings together remarkable artists for a cause that matters.

  This production marks a final collaboration with our former Creative Director, William Stevens, before he embarks on an exciting new chapter of his career in Germany. A distinguished bass-baritone and a key figure in the development of our company, William returns not only as a creative collaborator but also to perform the formidable role of Scarpia, one of opera's most compelling villains.

  Set in a world of political intrigue, power and passion, Tosca is among Puccini's most dramatic and beloved operas. From its soaring melodies to its moments of heart-stopping tension, this timeless masterpiece continues to captivate audiences around the world.

  This performance is made even more meaningful by its charitable purpose. Proceeds from the production will support Diabetes UK, helping to fund research, raise awareness, and provide support for those affected by diabetes.

  As we celebrate William's contribution to our company and wish him every success in Germany, we invite audiences to join us for an unforgettable evening of great music, powerful drama, and community spirit—all in support of a worthy cause.