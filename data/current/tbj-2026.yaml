description: A double feature of Gilbert & Sullivan's hilarious one-act opera and a one-act comedy concert by CCO
description_long: |
  **Act 1: Arias for the Defence**

  Four operatic lawyers meet to discuss the hazards of defending the criminal underworld of the opera canon. From Figaro’s latest scheme to Tosca’s taste for blood, each lawyer has a catalogue of troublesome clients — and more than a few grievances of their own. As professional composure begins to unravel, one question remains... *how do lawyers sleep at night?*

  **Act 2: Trial by Jury**

  A broken engagement, a furious bride, a bewildered defendant and a jury with some very unconventional ideas about justice: Gilbert and Sullivan’s Trial by Jury turns the English courtroom into a riotous comedy of love and law. Expect romance, revenge, ridiculous legal arguments and plenty of musical mischief. Cardiff Cotswold opera is delighted to partner with the Thames head singers for this fabulous production. 